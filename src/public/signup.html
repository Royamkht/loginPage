<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <main class="login_card">
      <h1 class="login_title">Create account</h1>
      <p class="login_hint">
        Password: 8+ characters, one capital letter, one number.
      </p>
      <form class="login_form" id="signup_form" novalidate>
        <label class="field_label" for="username">Username</label>
        <input
          class="field_input"
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          minlength="3"
          required
        />

        <label class="field_label" for="password">Password</label>
        <input
          class="field_input"
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
        />

        <label class="field_label" for="password_confirm">Confirm password</label>
        <input
          class="field_input"
          id="password_confirm"
          name="password_confirm"
          type="password"
          autocomplete="new-password"
          required
        />

        <button class="primary_button" type="submit">Sign up</button>
      </form>
      <div class="status_region" aria-live="polite">
        <p class="status_message" id="status_message" role="status"></p>
        <ul class="status_error_list" id="status_error_list" hidden></ul>
      </div>
      <p class="form_footer_links">
        <a class="secondary_link" href="/">Back to sign in</a>
      </p>
    </main>
    <script src="/signup.js" type="module"></script>
  </body>
</html>
