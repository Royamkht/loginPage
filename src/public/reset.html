<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <main class="login_card">
      <h1 class="login_title">Reset password</h1>
      <p class="login_hint">
        Use the token from the forgot-password step. New password: 8+ chars,
        one capital, one number.
      </p>
      <form class="login_form" id="reset_form" novalidate>
        <label class="field_label" for="username">Username</label>
        <input
          class="field_input"
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        />

        <label class="field_label" for="token">Reset token</label>
        <input
          class="field_input"
          id="token"
          name="token"
          type="text"
          autocomplete="one-time-code"
          required
        />

        <label class="field_label" for="new_password">New password</label>
        <input
          class="field_input"
          id="new_password"
          name="new_password"
          type="password"
          autocomplete="new-password"
          required
        />

        <button class="primary_button" type="submit">Update password</button>
      </form>
      <div class="status_region" aria-live="polite">
        <p class="status_message" id="status_message" role="status"></p>
        <ul class="status_error_list" id="status_error_list" hidden></ul>
      </div>
      <p class="form_footer_links">
        <a class="secondary_link" href="/">Sign in</a>
        ·
        <a class="secondary_link" href="/forgot.html">Forgot password</a>
      </p>
    </main>
    <script src="/reset.js" type="module"></script>
  </body>
</html>
